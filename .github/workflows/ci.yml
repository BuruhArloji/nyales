name: NYALES CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm ci
      - name: Install bounded solver dependencies
        run: python scripts/visit-solver-setup.py
      - run: mkdir -p test-results
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run pilot:release-gate -- docs/release-gate-ci.json
      - name: Upload release readiness report (not production approval)
        uses: actions/upload-artifact@v4
        with:
          name: nyales-release-gate
          path: docs/release-gate-ci.json
