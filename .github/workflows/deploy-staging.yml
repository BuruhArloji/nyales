name: NYALES staging deploy
on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Exact https://nyales-staging.<account-subdomain>.workers.dev origin'
        required: true
        type: string
      seed_bekasi_demo:
        description: 'Apply the synthetic Bekasi portfolio dataset to staging D1 only'
        required: false
        type: boolean
        default: false
      map_bekasi_demo_points:
        description: 'Embed DEMO operations on 200 existing customer point IDs; no customer/coordinate updates'
        required: false
        type: boolean
        default: false
      complete_bekasi_analysis:
        description: 'Add synthetic Bekasi targets and incentive previews; extend verified pilot target by revision, preserving values and history'
        required: false
        type: boolean
        default: false
      expand_beverage_demo:
        description: 'Add connected November DEMO: 6 reps, 800 location links, beverage SKUs, 400 visits/orders/invoices and incentives'
        required: false
        type: boolean
        default: false
      normalize_identity_names:
        description: 'Use original linked shop names and common sales names; preserve IDs and business history'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nyales-staging
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Draft releases are visible only to a token with repository write access.
    # This isolated job receives no Cloudflare/Firebase secrets.
    permissions:
      contents: write
    steps:
      - name: Deploy main only
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Download and validate private portfolio demo package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio-archive" "$RUNNER_TEMP/portfolio-demo"
          gh release download nyales-demo-territory-20261103 --repo "$GITHUB_REPOSITORY" --pattern portfolio-demo.tar.gz --dir "$RUNNER_TEMP/portfolio-archive"
          tar -xzf "$RUNNER_TEMP/portfolio-archive/portfolio-demo.tar.gz" -C "$RUNNER_TEMP/portfolio-demo"
          node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const root=process.env.RUNNER_TEMP+'/portfolio-demo'; const checks=JSON.parse(fs.readFileSync(root+'/PACKAGE_CHECKSUMS.json','utf8')); for (const [name,meta] of Object.entries(checks.artifacts)) { const hash=crypto.createHash('sha256').update(fs.readFileSync(root+'/'+name)).digest('hex'); if(hash!==meta.sha256) throw Error('PACKAGE_CHECKSUM_MISMATCH '+name); }"
      - name: Pass verified files to staging job
        uses: actions/upload-artifact@v4
        with:
          name: nyales-portfolio-demo-package
          path: ${{ runner.temp }}/portfolio-demo/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_NYALES_DEMO_TERRITORY_URL: /demo/territories-demo.pmtiles
      NYALES_STAGING_URL: ${{ inputs.staging_url }}
      FIRST_ADMIN_EMAIL: ${{ vars.FIRST_ADMIN_EMAIL }}
      FIRST_ADMIN_ORGANIZATION_NAME: ${{ vars.FIRST_ADMIN_ORGANIZATION_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy main only
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm ci
      - name: Validate staging configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module -e "import {stagingOrigin} from './scripts/staging-smoke.mjs'; stagingOrigin(process.env.NYALES_STAGING_URL);"
          node scripts/prepare-staging-wrangler.mjs
      - run: python scripts/visit-solver-setup.py
      - run: npm run check
      - run: mkdir -p test-results
      - run: npm test
      - name: Build with matching Firebase web project
        run: npm run build
      - name: Validate deploy bundle without publishing
        run: npx wrangler deploy --dry-run --config wrangler.staging.generated.json
      - name: Review pending staging D1 migrations
        run: npx wrangler d1 migrations list nyales-staging --remote --config wrangler.staging.generated.json
      - name: Receive verified portfolio package
        uses: actions/download-artifact@v4
        with:
          name: nyales-portfolio-demo-package
          path: ${{ runner.temp }}/portfolio-demo
      - name: Recheck portfolio package checksums
        run: node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const root=process.env.RUNNER_TEMP+'/portfolio-demo'; const checks=JSON.parse(fs.readFileSync(root+'/PACKAGE_CHECKSUMS.json','utf8')); for (const [name,meta] of Object.entries(checks.artifacts)) { const hash=crypto.createHash('sha256').update(fs.readFileSync(root+'/'+name)).digest('hex'); if(hash!==meta.sha256) throw Error('PACKAGE_CHECKSUM_MISMATCH '+name); }"
      - name: Upload portfolio demo assets to staging R2
        run: |
          npx wrangler r2 object put "$CF_R2_BUCKET/portfolio-demo/territories-demo.pmtiles" --file "$RUNNER_TEMP/portfolio-demo/territories-demo.pmtiles" --remote --config wrangler.staging.generated.json --content-type application/vnd.pmtiles --cache-control 'public, max-age=300' --force
          npx wrangler r2 object put "$CF_R2_BUCKET/portfolio-demo/manifest.json" --file "$RUNNER_TEMP/portfolio-demo/manifest.json" --remote --config wrangler.staging.generated.json --content-type 'application/json; charset=utf-8' --cache-control 'public, max-age=300' --force
          npx wrangler r2 object put "$CF_R2_BUCKET/portfolio-demo/area-summary.json" --file "$RUNNER_TEMP/portfolio-demo/area-summary.json" --remote --config wrangler.staging.generated.json --content-type 'application/json; charset=utf-8' --cache-control 'public, max-age=300' --force
          npx wrangler r2 object put "$CF_R2_BUCKET/portfolio-demo/exceptions.csv" --file "$RUNNER_TEMP/portfolio-demo/exceptions.csv" --remote --config wrangler.staging.generated.json --content-type 'text/csv; charset=utf-8' --cache-control 'public, max-age=300' --force
      - name: Apply staging D1 migrations (no seed)
        run: npx wrangler d1 migrations apply nyales-staging --remote --config wrangler.staging.generated.json
      - name: Deploy staging Worker and assets
        run: npx wrangler deploy --config wrangler.staging.generated.json
      - name: Apply synthetic Bekasi portfolio dataset
        if: ${{ inputs.seed_bekasi_demo == true }}
        run: npx tsx scripts/seed-bekasi-portfolio.ts --apply --remote
      - name: Embed Bekasi DEMO operations on existing customer points
        if: ${{ inputs.map_bekasi_demo_points == true }}
        run: npx tsx scripts/map-bekasi-demo-points.ts --apply --remote
      - name: Complete synthetic Bekasi analysis
        if: ${{ inputs.complete_bekasi_analysis == true }}
        run: npx tsx scripts/complete-bekasi-analysis.ts --apply --remote
      - name: Apply connected beverage DEMO package
        if: ${{ inputs.expand_beverage_demo == true }}
        run: npx tsx scripts/apply-beverage-demo.ts --apply --remote
      - name: Normalize linked customer and sales names
        if: ${{ inputs.normalize_identity_names == true }}
        run: npx tsx scripts/rename-demo-identities.ts --apply --remote
      - name: Verify served staging and auth boundaries
        run: node scripts/staging-smoke.mjs "$NYALES_STAGING_URL" test-results/staging-smoke.json
