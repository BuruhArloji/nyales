// Firebase BoM 35 requires newer Kotlin metadata than this Expo toolchain supports.
// Keep this temporary override aligned with the Android build until Kotlin is upgraded.
gradle.beforeProject { project ->
  if (project == project.rootProject) {
    project.ext.set('react-native', [versions: [firebase: [bom: '34.14.1']]])
  }
}

gradle.beforeProject { project ->
  if (project.path != ':app') return
  project.plugins.withId('com.android.application') {
    project.extensions.getByName('androidComponents').finalizeDsl { android ->
      def store = System.getenv('NYALES_SIGNING_STORE')
      def password = System.getenv('NYALES_SIGNING_PASSWORD')
      if (!store || !password) throw new GradleException('NYALES development signing configuration missing')
      def signing = android.signingConfigs.maybeCreate('nyalesDevelopment')
      signing.storeFile = new File(store)
      signing.storeType = 'PKCS12'
      signing.storePassword = password
      signing.keyAlias = 'nyales-dev'
      signing.keyPassword = password
      android.buildTypes.getByName('debug').signingConfig = signing
    }
  }
}
